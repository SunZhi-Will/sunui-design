name: Release

# 用 npm Trusted Publishing（OIDC）發佈，不需要 NPM_TOKEN。
# 每個套件都要先在 npmjs.com 的 Settings > Trusted Publisher 設定此 repo 與 release.yml。
# 觸發方式：推送 v* tag，或在 Actions 頁面手動執行。只會發佈 npm 上還沒有的版本。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm 11.5.1 以上
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build:packages

      - name: Test
        run: npm test

      - name: Publish to npm
        run: node scripts/publish-unpublished.mjs
